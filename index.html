<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtualizar - Modo App Nativa</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root { --accent: #00d4ff; }
        body { margin: 0; font-family: sans-serif; background: #111; color: white; }
        
        header { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid var(--accent); }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 2px; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap; /* Para que se adapte en móviles */
        }

        .btn-model {
            background: #222;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-model:hover { background: #333; }
        .btn-model.active { background: var(--accent); color: #000; }

        model-viewer {
            width: 100%;
            height: 60vh;
            background-color: #1a1a1a; /* Fondo gris oscuro para ver mejor el modelo */
        }

        #ar-button {
            background: var(--accent);
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: block;
            margin: 20px auto;
            position: absolute; /* Posicionamiento sobre el visor */
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header><div class="logo">VIRTUALIZAR</div></header>

    <div class="controls">
        <button class="btn-model active" onclick="switchModel('withered_freddy_by_nickels02_dcy0vp2.glb', this)">FREDDY</button>
        <button class="btn-model" onclick="switchModel('Lechuga.glb', this)">LECHUGA</button>
        <button class="btn-model" onclick="switchModel('model.glb', this)">MODELO 3</button>
        <button class="btn-model" onclick="switchModel('platoNegro.glb', this)">PLATO</button>
    </div>

    <model-viewer 
        id="visor"
        src="withered_freddy_by_nickels02_dcy0vp2.glb" 
        ios-src="withered_freddy_by_nickels02_dcy0vp2.usdz"
        ar
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls
        ar-scale="auto"
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
            📦 VER EN TU ESPACIO
        </button>
    </model-viewer>

    <script>
        function switchModel(fileName, element) {
            const viewer = document.querySelector('#visor');
            
            // Limpiamos espacios en blanco por si acaso con .trim()
            const cleanName = fileName.trim();
            
            viewer.src = cleanName;
            
            // IMPORTANTE: Para iPhone (iOS) necesitas el archivo .usdz
            // Si no tienes el archivo .usdz, el botón AR no funcionará en iPhone.
            viewer.iosSrc = cleanName.replace('.glb', '.usdz');

            document.querySelectorAll('.btn-model').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
