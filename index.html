<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR con Bloqueo de Posición</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root { --accent: #00d4ff; --success: #00ff41; }
        body { margin: 0; font-family: sans-serif; background: #111; color: white; }
        
        header { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid var(--accent); }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 2px; }

        .controls {
            display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap;
        }

        .btn-model {
            background: #222; color: var(--accent); border: 1px solid var(--accent);
            padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        .btn-model.active { background: var(--accent); color: #000; }

        model-viewer {
            width: 100%; height: 65vh; background-color: #1a1a1a; position: relative;
        }

        /* Botón AR para entrar */
        #ar-button {
            background: var(--accent); color: black; border: none;
            padding: 12px 24px; border-radius: 50px; font-weight: bold;
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            z-index: 10;
        }

        /* Instrucciones */
        .ar-instructions {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px;
            font-size: 0.8rem; pointer-events: none; opacity: 0.8; z-index: 5;
            white-space: nowrap;
        }

        /* === NUEVO: BOTÓN DE FIJAR (CHECK) === */
        #lock-btn {
            position: absolute;
            bottom: 20px; 
            right: 20px; /* A la derecha del todo */
            width: 50px; height: 50px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 20; /* Por encima de todo */
            transition: all 0.3s ease;
        }

        /* Estado Activo (Bloqueado) */
        #lock-btn.locked {
            background: var(--success);
            color: black;
            box-shadow: 0 0 15px var(--success);
        }
        
        /* Ocultar botón lock si no estamos en un modo interactivo (opcional) */
        model-viewer:not([ar-status="session-started"]) #lock-btn {
            /* Puedes descomentar esto si solo quieres el boton durante AR */
            /* display: none; */ 
        }

    </style>
</head>
<body>

    <header><div class="logo">VIRTUALIZAR</div></header>

    <div class="controls">
        <button class="btn-model active" onclick="switchModel('withered_freddy_by_nickels02_dcy0vp2.glb', this)">FREDDY</button>
        <button class="btn-model" onclick="switchModel('Lechuga.glb', this)">LECHUGA</button>
        <button class="btn-model" onclick="switchModel('model.glb', this)">MODELO 3</button>
        <button class="btn-model" onclick="switchModel('platoNegro.glb', this)">MODELO 4</button>
    </div>

    <model-viewer 
        id="visor"
        src="withered_freddy_by_nickels02_dcy0vp2.glb" 
        ios-src="withered_freddy_by_nickels02_dcy0vp2.usdz"
        ar
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls
        ar-scale="auto"
        ar-placement="floor"
        shadow-intensity="1"
        interaction-prompt="auto">
        
        <div class="ar-instructions">🖐️ Mover | ✌️ Escalar</div>

        <button slot="ar-button" id="ar-button">
            📦 VER EN TU ESPACIO
        </button>

        <button id="lock-btn" onclick="toggleLock()" title="Fijar posición">
            🔓
        </button>

    </model-viewer>

    <script>
        // Lógica de cambio de modelo
        function switchModel(fileName, element) {
            const viewer = document.querySelector('#visor');
            const cleanName = fileName.trim();
            
            viewer.src = cleanName;
            viewer.iosSrc = cleanName.replace('.glb', '.usdz');
            viewer.scale = '1 1 1'; 

            // Al cambiar modelo, desbloqueamos por seguridad
            unlockModel();

            document.querySelectorAll('.btn-model').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // === LÓGICA DE BLOQUEO (FIJAR) ===
        let isLocked = false;
        const lockBtn = document.getElementById('lock-btn');
        const viewer = document.querySelector('#visor');

        function toggleLock() {
            if (isLocked) {
                unlockModel();
            } else {
                lockModel();
            }
        }

        function lockModel() {
            isLocked = true;
            lockBtn.innerHTML = "✅"; // Cambia icono a check
            lockBtn.classList.add('locked');
            
            // Magia de Model-Viewer para congelar
            viewer.setAttribute('disable-pan', ''); // Evita moverlo de lado a lado
            viewer.setAttribute('interaction-prompt', 'none'); // Quita la manito de ayuda
            viewer.setAttribute('ar-scale', 'fixed'); // Evita que cambie de tamaño
            
            // Opcional: Desactivar zoom en modo 3D web
            viewer.setAttribute('disable-zoom', ''); 
        }

        function unlockModel() {
            isLocked = false;
            lockBtn.innerHTML = "🔓"; // Cambia icono a candado abierto
            lockBtn.classList.remove('locked');
            
            // Reactivar todo
            viewer.removeAttribute('disable-pan');
            viewer.setAttribute('interaction-prompt', 'auto');
            viewer.setAttribute('ar-scale', 'auto');
            viewer.removeAttribute('disable-zoom');
        }
    </script>
</body>
</html>
